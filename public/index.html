<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disc Golf Wind Caddie</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-3xl mx-auto">
        
        <!-- Ylätunniste ja radanvalitsin -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-teal-400 mb-4">Disc Golf Wind Caddie</h1>
            <p class="text-slate-400 text-sm mb-6">Reaaliaikainen tuilianalyysi ja taktiset vinkit frisbeegolfiin</p>
            
            <!-- Radan valintapudotusvalikko -->
            <div class="mb-6 flex flex-col sm:flex-row justify-center items-center gap-2">
                <label for="course-select" class="text-sm font-medium text-slate-300">Valitse rata:</label>
                <select id="course-select" onchange="onCourseChange(this.value)" class="bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 shadow-lg focus:outline-none focus:border-teal-500 w-full sm:w-80">
                    <option value="">Ladataan ratoja...</option>
                </select>
            </div>

            <!-- Sääinfo-laatikko -->
            <div id="weather-box" class="inline-block bg-slate-800 border border-slate-700 rounded-xl px-6 py-3 shadow-lg text-sm sm:text-base hidden">
                <span id="weather-info">Haetaan säätietoja...</span>
            </div>
        </header>

        <!-- Väylälista / Caddie-kortit -->
        <main id="holes-container" class="space-y-4">
            <div class="text-center text-slate-500 py-10">Ladataan rataa...</div>
        </main>
    </div>

    <script>
        // Haetaan listaus radoista sivun latautuessa
        async function loadCourses() {
            try {
                const response = await fetch('/api/courses');
                const courses = await response.json();

                const select = document.getElementById('course-select');
                select.innerHTML = '';

                courses.forEach((course) => {
                    const option = document.createElement('option');
                    option.value = course.id;
                    option.textContent = course.name;
                    select.appendChild(option);
                });

                // Ladataan oletuksena ensimmäinen rata listasta
                if (courses.length > 0) {
                    loadWeatherData(courses[0].id);
                }
            } catch (err) {
                console.error('Virhe ratojen haussa:', err);
                document.getElementById('holes-container').innerHTML = '<div class="text-center text-red-400 py-10">Virhe ratojen latauksessa.</div>';
            }
        }

        // Kun käyttäjä vaihtaa rataa valikosta
        function onCourseChange(courseId) {
            if (courseId) {
                loadWeatherData(courseId);
            }
        }

        // Haetaan valitun radan sää ja väylätiedot
        async function loadWeatherData(courseId) {
            try {
                const container = document.getElementById('holes-container');
                container.innerHTML = '<div class="text-center text-slate-400 py-10">Ladataan säätietoja ja väyläanalyysejä...</div>';

                const response = await fetch(`/api/courses/${courseId}/weather`);
                const data = await response.json();

                // Näytetään säälaatikko
                const weatherBox = document.getElementById('weather-box');
                weatherBox.classList.remove('hidden');

                const w = data.currentWeather;
                document.getElementById('weather-info').innerHTML = `
                    🌡️ Lämpötila: <strong class="text-teal-300">${w.temperature}°C</strong> | 
                    💨 Tuuli: <strong class="text-teal-300">${w.windSpeed} m/s</strong> (Suunta: <strong class="text-teal-300">${w.windDirection}°</strong>) | 
                    ⚡ Puuskat: <strong class="text-amber-400">${w.windGusts} m/s</strong>
                `;

                // Piirretään väylät
                container.innerHTML = '';

                data.holes.forEach(hole => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-teal-500 transition-all";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="bg-teal-600 text-white font-bold px-3 py-1 rounded-lg text-lg">Väylä ${hole.hole_number}</span>
                                <span class="text-slate-400 text-sm">Par ${hole.par} • ${hole.length_meters}m • Heittosuunta ${hole.throw_direction_deg}°</span>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-700/50">
                            <div class="text-teal-300 font-semibold mb-1">🌪️ ${hole.windAnalysis.type}</div>
                            <p class="text-slate-300 text-sm">${hole.windAnalysis.advice}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('holes-container').innerHTML = '<div class="text-center text-red-400 py-10">Virhe ladattaessa säätietoja radalle.</div>';
            }
        }

        // Käynnistetään sovellus
        loadCourses();
    </script>
</body>
</html>
